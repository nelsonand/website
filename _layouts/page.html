---
layout: base
---

<header class="page-head{% if page.portrait %} with-portrait{% endif %}">
  <div class="wrap">
    <div>
      {% if page.kicker %}<div class="kicker">{{ page.kicker }}</div>{% endif %}
      <h1>{{ page.headline | default: page.title }}</h1>
      {% if page.subtitle %}<p class="lede">{{ page.subtitle }}</p>{% endif %}
    </div>
    {% if page.portrait %}
    <div class="portrait">
      <img src="{{ page.portrait | relative_url }}" alt="Photo of {{ site.author }}">
      {% if page.portrait-caption %}<div class="cap">{{ page.portrait-caption }}</div>{% endif %}
    </div>
    {% endif %}
  </div>
</header>

<main class="page-body">
  <div class="wrap">
    {{ content }}
  </div>
</main>
